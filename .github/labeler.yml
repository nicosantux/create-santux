💻 source:
  - changed-files:
      - any-glob-to-any-file:
          - packages/*/src/**

📝 documentation:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - packages/*/README.md

🏭 build:
  - changed-files:
      - any-glob-to-any-file:
          - .node-version
          - packages/*/tsconfig.json
          - packages/*/tsdown.config.ts

⚙️ configuration:
  - changed-files:
      - any-glob-to-any-file:
          - commitlint.config.js
          - .editorconfig
          - oxfmt.config.ts
          - oxlint.config.ts
          - .gitignore
          - .node-version
          - .prettierignore

📦 dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - pnpm-workspace.yaml
          - packages/*/package.json
          - pnpm-lock.yaml

🤖 ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - .github/dependabot.yml
          - .github/workflows/**
          - .husky/**

🏠 github configuration:
  - changed-files:
      - any-glob-to-any-file:
          - .github/labeler.yml
          - .github/labels.yml
          - .github/settings.yml

🧪 tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.test.ts'

🚀 feature:
  - head-branch: ['^feat', '^feature']

🩹 fix:
  - head-branch: ['^fix', '^hotfix']

🧹 chore:
  - head-branch: ['^chore']
