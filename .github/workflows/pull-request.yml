name: Pull Request

on:
  pull_request:
    branches: [main]
    types: ['opened', 'synchronize']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: 💅 Format
    runs-on: ubuntu-latest
    steps:
      - name: 🎯 Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: 💅 Run oxfmt
        run: pnpm format

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 🎯 Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: 🧹 Run oxlint
        run: pnpm lint

      - name: 🔎 Typecheck
        run: pnpm typecheck

  build:
    name: 🏗️ Build
    needs: [lint, format]
    runs-on: ubuntu-latest
    steps:
      - name: 🎯 Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: 🏗️ Build project
        run: pnpm build

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: 🎯 Checkout
        uses: actions/checkout@v5

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: 🧪 Run tests
        run: pnpm test
